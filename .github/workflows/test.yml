name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-save @deepseek-ai/dsh-llm @deepseek-ai/dsh-subprocess @deepseek-ai/schemastery
      - run: node test/unit.mjs
      - run: node test/smoke.mjs
      - run: node test/smoke-terminal.mjs
